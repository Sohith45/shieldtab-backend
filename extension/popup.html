<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 320px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #fff;
    color: #202124;
  }
  .header {
    background: #1a73e8;
    color: white;
    padding: 16px 18px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .header img { width: 28px; height: 28px; }
  .header h1 { font-size: 16px; font-weight: 600; }
  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 14px 18px;
    border-bottom: 1px solid #e8eaed;
  }
  .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #34a853;
  }
  .dot.offline { background: #ea4335; }
  .status-text { font-size: 13px; color: #3c4043; }
  .stats {
    display: flex;
    padding: 16px 18px;
    gap: 12px;
  }
  .stat-box {
    flex: 1;
    background: #f8f9fa;
    border-radius: 8px;
    padding: 12px;
    text-align: center;
  }
  .stat-number { font-size: 22px; font-weight: 700; color: #1a73e8; }
  .stat-label { font-size: 11px; color: #5f6368; margin-top: 2px; }
  .toggle-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 18px;
    border-top: 1px solid #e8eaed;
  }
  .toggle-row span { font-size: 13px; }
  .switch {
    position: relative;
    width: 40px;
    height: 22px;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; cursor: pointer;
    top: 0; left: 0; right: 0; bottom: 0;
    background-color: #dadce0;
    border-radius: 22px;
    transition: 0.2s;
  }
  .slider:before {
    position: absolute;
    content: "";
    height: 16px; width: 16px;
    left: 3px; bottom: 3px;
    background-color: white;
    border-radius: 50%;
    transition: 0.2s;
  }
  input:checked + .slider { background-color: #1a73e8; }
  input:checked + .slider:before { transform: translateX(18px); }
  .footer {
    padding: 10px 18px;
    font-size: 11px;
    color: #80868b;
    text-align: center;
    border-top: 1px solid #e8eaed;
  }
</style>
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="ShieldTab">
    <h1>ShieldTab</h1>
  </div>

  <div class="status">
    <div class="dot" id="statusDot"></div>
    <div class="status-text" id="statusText">Checking backend connection...</div>
  </div>

  <div class="stats">
    <div class="stat-box">
      <div class="stat-number" id="blockedCount">0</div>
      <div class="stat-label">Blocked today</div>
    </div>
    <div class="stat-box">
      <div class="stat-number" id="checkedCount">0</div>
      <div class="stat-label">URLs checked</div>
    </div>
  </div>

  <div class="toggle-row">
    <span>Real-time protection</span>
    <label class="switch">
      <input type="checkbox" id="protectionToggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="footer">Hybrid XGBoost + CNN detection engine</div>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
